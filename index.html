<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineWave - Streaming Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Navigation Bar -->
        <nav class="nav">

            <div class="logo">CineWave</div>

            <div class="links">
                <a href="#">Home</a>
                <a href="#">Shows</a>
                <a href="#">Sign In</a>
            </div>

        </nav>


        <!-- Featured Banner -->
        <header class="banner">

            <h1 class="title">Neon Skyline</h1>

            <p>
                A detective chases a mysterious signal
                through a sleepless city.
            </p>

            <button>▶ Play</button>

        </header>


        <!-- Show Cards -->
        <section class="cards">

            <article class="card" data-new="true">
                Cinderwood
            </article>

            <article class="card">
                Deep Harbor
            </article>

            <article class="card" data-new="true">
                Paper Moons
            </article>

            <article class="card">
                Low Tide
            </article>

        </section>

    </div>

</body>
</html>
